name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  # Lets `push` runs skip their checks when a pull request run already verified the pushed
  # tree. `required-checks` records each such tree as a `verified-tree-<tree>` artifact.
  verified-tree:
    name: Verified tree
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)
          # Records uploaded by pull requests from forks are not trusted.
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=verified-tree-$tree" \
            --jq '[.artifacts[] | select(.expired | not) | .workflow_run |
              select(.head_repository_id == .repository_id)][0].id // empty')
          if [ -n "$run_id" ]; then
            echo "Skipping checks: tree $tree was verified by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

  # The jobs below need `!failure() && !cancelled()` to keep running when `verified-tree` is
  # skipped, i.e. for pull requests: without a status check function, `success()` is implied,
  # which also covers the skipped `verified-tree`.
  arch-test:
    name: Julia ${{ matrix.version }} / ${{ matrix.os }} ${{ matrix.arch }}
    needs: verified-tree
    if: ${{ !failure() && !cancelled() && needs.verified-tree.outputs.verified != 'true' }}
    runs-on: ${{ matrix.os }}
    # Failures against an unreleased Julia should not block merging.
    continue-on-error: ${{ matrix.version == 'nightly' || matrix.version == 'pre' }}
    strategy:
      fail-fast: false # don't stop CI even when one of them fails
      matrix:
        include:
          - version: '1' # current stable
            os: ubuntu-latest
            arch: x64
          - version: "1.12" # minimum version supported
            os: ubuntu-latest
            arch: x64
          - version: "pre" # next release
            os: ubuntu-latest
            arch: x64
          - version: "nightly" # nightly
            os: ubuntu-latest
            arch: x64
          - version: "1" # x86 ubuntu
            os: ubuntu-latest
            arch: x86
          - version: "1" # macOS
            os: macos-latest
            arch: default
          - version: "1" # x86 windows
            os: windows-latest
            arch: x64
          - version: "1" # x86 windows
            os: windows-latest
            arch: x86
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: set preferences  # needs to happen before precompile_workload
        working-directory: .
        run: |
          echo '[JET]
          JET_DEV_MODE = true' >  LocalPreferences.toml
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7

  preference-test:
    name: JET_DEV_MODE=${{ matrix.JET_DEV_MODE }} / use_fixed_world=${{ matrix.use_fixed_world }} / precompile_workload=${{ matrix.precompile_workload }}
    needs: verified-tree
    if: ${{ !failure() && !cancelled() && needs.verified-tree.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        JET_DEV_MODE: [true, false]
        use_fixed_world: [true, false]
        precompile_workload: [true, false]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
          arch: x64
      - uses: julia-actions/cache@v3
      - name: set preferences  # needs to happen before precompile_workload
        working-directory: .
        run: |
          echo '[JET]
          JET_DEV_MODE = ${{ matrix.JET_DEV_MODE }}
          use_fixed_world = ${{ matrix.use_fixed_world }}
          precompile_workload = ${{ matrix.precompile_workload }}' >  LocalPreferences.toml
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7

  multithreading-test:
    name: JULIA_NUM_THREADS=4,2
    needs: verified-tree
    if: ${{ !failure() && !cancelled() && needs.verified-tree.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
          arch: x64
      - uses: julia-actions/cache@v3
      - name: set preferences
        working-directory: .
        run: |
          echo '[JET]
          JET_DEV_MODE = true' >  LocalPreferences.toml
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
        env:
          JULIA_NUM_THREADS: "4,2"

  empty-loading-test:
    needs: verified-tree
    if: ${{ !failure() && !cancelled() && needs.verified-tree.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "nightly"
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest

  jetls-check:
    needs: verified-tree
    if: ${{ !failure() && !cancelled() && needs.verified-tree.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aviatesk/JETLS.jl/.github/actions/check@release

  # `push` runs are handled by `docs.yml` itself since they deploy.
  docs:
    name: Documentation
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      statuses: write
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  required-checks:
    name: Required checks
    if: always()
    needs:
      - verified-tree
      - arch-test
      - preference-test
      - multithreading-test
      - empty-loading-test
      - jetls-check
      - docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e --arg event "$GITHUB_EVENT_NAME" '
            if $event == "pull_request" then del(.["verified-tree"])
            elif .["verified-tree"].outputs.verified == "true" then {}
            else del(.["verified-tree"], .docs)
            end | all(.[]; .result == "success")' <<<"$RESULTS" >/dev/null
      - name: Get the verified tree
        id: tree
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_SHA" > verified-tree
      - name: Record the verified tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: verified-tree-${{ steps.tree.outputs.tree }}
          path: verified-tree
          if-no-files-found: error
          overwrite: true
